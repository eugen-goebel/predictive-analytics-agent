[project]
name = "predictive-analytics-agent"
version = "1.0.0"
description = "Multi-agent predictive analytics pipeline with a Streamlit dashboard and DOCX reporting"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.62.0",
    "scikit-learn>=1.9.0",
    "pandas>=3.0.5",
    "numpy>=2.5.2; python_version >= '3.12'",
    "numpy>=2.4.6,<2.5.0; python_version < '3.12'",
    "matplotlib>=3.11.1",
    "python-docx>=1.2.0",
    "pydantic>=2.13.4",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length is handled by the formatter
# B008: FastAPI's Depends()/File() default-argument idiom is intentional
ignore = ["E501", "B008"]
